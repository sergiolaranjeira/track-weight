<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>10-Week Transformation Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="brand-badge">Start Date: Wed Aug 26 • Mon-Sun Calendar</div>
    <h1>10-Week Transformation Plan</h1>
    <p class="subtitle">Personalized tracker for a 1.93m height profile. Features Mon-Sun weekly views, exercise logs, Sunday progress photos, and weighted 0-10 daily quality scores.</p>
  </header>

  <section class="dashboard-card">
    <div class="progress-header">
      <div class="progress-title">10-Week Overall Progress</div>
      <div class="progress-number" id="overall-percentage">0%</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="overall-bar"></div>
    </div>
  </section>

  <section class="controls-wrapper">
    <div class="week-nav" id="week-buttons-container"></div>
    <div class="action-bar">
      <div class="week-info-tag" id="week-info-title">Week 1 <span>Phase 1: Rapid Loss Phase</span></div>
      <button class="btn-reset" onclick="resetAllData()">Reset All</button>
    </div>
  </section>

  <main class="days-grid" id="days-grid-container"></main>

  <script src="script.js"></script>
</body>
</html>
